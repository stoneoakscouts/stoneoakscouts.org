groups:
  - id: pack-226
    heading: Pack 226
    blurb: Kindergarten through fifth grade.
    leaders:
      - name: Betty Wicks
        photo: bio-betty-wicks.jpg
        photo_width: 231
        photo_height: 276
        title: Cubmaster, Pack 226
        also: Tiger Den Leader
        paragraphs:
          - >
            I volunteer because of the growth I have seen in myself, my kids,
            and all of the scouts. It is memorable to watch them go from being
            out of their comfort zone to developing confidence and having fun.
            Scouting is designed not just to teach outdoor skills, but also
            leadership, communication, and relationship skills they can rely
            on for the rest of their lives.
          - >
            On pack campouts I see den-meeting skills come together—scouts
            cooking their own food, practicing safety, inventing skits, and
            enjoying the hikes.
        aside: Homeschools her five kids. Three years as an adult leader.

      - name: Jeremy Goldin
        photo: bio-jeremy-goldin.jpg
        photo_width: 222
        photo_height: 234
        title: Committee Chair, Pack 226
        also: Webelos and Bear Den Leader
        paragraphs:
          - >
            It started as a way to help my children build teamwork and
            character. Watching the cubs grow has taught me how to better
            foster that in the youth and in myself.
          - >
            I still laugh about following cubs hopping across stones in the
            Guadalupe River—and occasionally falling in.
          - >
            The trampoline in my backyard was bought for me, not for my kids.
        aside: Engineering manager with the U.S. Air Force. Two years as an adult leader.

      - name: Nayana Wagle
        photo: bio-nayana-wagle.jpg
        photo_width: 218
        photo_height: 256
        title: Treasurer, Pack 226
        also: Assistant Den Leader
        paragraphs:
          - >
            Half the cubs once got to draw whatever they wanted, while the
            other half got impossible assignments—pandas with elephant trunks,
            purple goats with four yellow eyes. When the groups switched, they
            quickly felt how unfair it was, and we had one of our best
            discussions about empathy and respect.
          - >
            I love designing hands-on activities and puzzles that help kids
            discover big ideas for themselves.
        aside: >
          Stay-at-home homeschooling mom. Two years as a youth in The Bharat
          Scouts and Guides in India; two years as an adult leader in Pack 226.

  - id: boys-troop-226
    heading: Boys Troop 226
    blurb: Sixth grade through age 18.
    leaders:
      - name: Keith Ludy
        photo: bio-keith-ludy.jpg
        photo_width: 624
        photo_height: 468
        title: Scoutmaster, Boys Troop 226
        also: Life to Eagle coordinator · committee member, Girls Troop 226G · unit commissioner
        paragraphs:
          - >
            My oldest son has ADHD, and I was looking for an after-school
            program for him. Scouting was the first thing that came up, and I
            have been here ever since.
          - >
            At our first summer camp, one of our boys struggled with his swim
            check. The rest of the troop got out of the pool and stood around
            to cheer him on until he finished. The whole pool area clapped and
            yelled his name afterward. It made me proud to watch them.
        aside: IT contractor. Seven years as an adult leader.

      - name: Trevor Baker
        photo: bio-trevor-baker.jpg
        photo_width: 454
        photo_height: 454
        title: Committee Chair, Boys Troop 226
        also: Merit badge counselor
        paragraphs:
          - >
            Scouting creates something increasingly rare: a chance to step away
            from everyday routines, try unfamiliar things, and learn through
            adventure. I enjoy helping Scouts explore new skills, build
            confidence, and have fun doing it. My hope is that every Scout
            leaves with a new experience, a new skill, and a story they will
            remember.
          - >
            I have a habit of turning every hobby into a learning project.
            Whether it is photography, fitness, or science, I enjoy figuring
            out how things work and helping others learn along the way.
        aside: >
          Provides technical support for scientific laboratory equipment.
          Four years as a Scout; three as an adult leader.

  - id: girls-troop-226g
    heading: Girls Troop 226G
    blurb: Sixth grade through age 18.
    leaders:
      - name: Penny Ludy
        photo: bio-penny-ludy.jpg
        photo_width: 267
        photo_height: 267
        title: Scoutmaster, Girls Troop 226G
        also: New Member Coordinator, Pack 226
        paragraphs:
          - >
            It started as supporting a program that was good for our family.
            We have four kids—18, 17, 15, and 10. The two oldest are Eagle
            Scouts and the others are on their way. My husband is also a
            scoutmaster, so this is truly a family hobby. Every young person
            deserves adults who believe in them before they fully believe in
            themselves. I live out my faith through service and believe God
            brings young people into my path for a reason. It is a privilege
            to walk alongside them as they grow into capable leaders.
          - >
            This past summer at Camp Constantine I headed out on a sunrise
            canoe trip with a few scouts and leaders. It was a beautiful
            moment of calm.
          - >
            I love a hike with a view at the top, as long as someone else is
            in charge of the map.
        aside: Digital product manager. Nine years as an adult leader.

  - id: chartered-organization
    heading: Chartered Organization
    blurb: Stone Oak Church charters Pack 226, Boys Troop 226, and Girls Troop 226G.
    leaders:
      - name: Mark Hardison
        photo: bio-mark-hardison.jpg
        photo_width: 218
        photo_height: 304
        title: Chartered Organization Representative
        paragraphs:
          - >
            I have been in Scouting most of my life. I believe in its
            principles, and I have seen it succeed in many young people.
          - >
            Fishing is my favorite outdoor activity. I met my future wife
            when I was 16, camping with my Scout troop. We still camp once a
            month, now in a travel trailer, and our two sons are both Eagle
            Scouts.
          - >
            Once a patrol dragged a log, 18 inches across and about twelve feet
            long, back to camp because I had told them if they could get it
            there they could burn it.
        aside: >
          Retired, U.S. Air Force and Northside ISD. Cub Scout four years,
          Boy Scout seven years, and an adult leader across several packs
          and troops.
